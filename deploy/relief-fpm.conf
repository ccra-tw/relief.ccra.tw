; 急難救助系統獨立的 PHP-FPM 程序池（2026-10-17）
; 原因：同主機其他站（Zabbix）用 fastcgi_param PHP_VALUE 改設定，共用 www 池時會殘留到別站的請求，
;       relief 的 .user.ini 上傳上限因此沒生效。獨立程序池後設定互不影響。
; 由 deploy.sh 安裝到 /etc/php/8.5/fpm/pool.d/relief.conf；nginx 的 relief 站台改連 /run/php/relief.sock
[relief]
user = www-data
group = www-data
listen = /run/php/relief.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 24M
php_admin_value[date.timezone] = Asia/Taipei
